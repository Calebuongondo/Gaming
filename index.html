<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nairobi Life 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b7d4;touch-action:none}canvas{display:block}#stick{position:fixed;left:5%;bottom:6%;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff70;background:#ffffff20;touch-action:none}#knob{position:absolute;left:33px;top:33px;width:52px;height:52px;border-radius:50%;background:#ffffff80;border:2px solid #fff}#run{position:fixed;right:5%;bottom:7%;border:1px solid #ffffff80;background:#263746bb;color:#fff;border-radius:50%;width:65px;height:65px;font-size:13px}#load{position:fixed;top:12px;left:12px;color:white;background:#0006;padding:8px;border-radius:8px;font:12px Arial}@media(orientation:portrait){body:after{content:"Rotate phone to landscape";position:fixed;inset:0;background:#111;color:white;display:grid;place-items:center;font:20px Arial}}</style></head><body><div id="load">Loading Uhuru Park…</div><div id="stick"><div id="knob"></div></div><button id="run">RUN</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc9df);scene.fog=new THREE.Fog(0x9fc9df,120,350);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53634b,2));const sun=new THREE.DirectionalLight(0xfff1d6,1.3);sun.position.set(30,60,20);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshLambertMaterial({color:0x777b76}));floor.rotation.x=-Math.PI/2;floor.position.y=-.15;scene.add(floor);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.9,3,6),new THREE.MeshLambertMaterial({color:0x253b58}));body.position.y=1;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,8,6),new THREE.MeshLambertMaterial({color:0x8a573c}));head.position.y=1.72;player.add(head);scene.add(player);
const loadingLabel=document.querySelector('#load');const assetURL='https://raw.githubusercontent.com/Calebuongondo/Gaming/main/Uhuru%20park.glb';const loader=new GLTFLoader();loader.load(assetURL,g=>{const model=g.scene;model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.position.y-=box.min.y;scene.add(model);player.position.set(0,0,Math.max(8,size.z*.12));loadingLabel.textContent='Uhuru Park loaded';},p=>{if(p.total)loadingLabel.textContent='Loading Uhuru Park '+Math.round(p.loaded/p.total*100)+'%';},e=>{loadingLabel.textContent='Model load failed: '+(e?.message||'network/CORS');console.error('Uhuru GLB loading error',e)});
let yaw=0,pitch=.12,jx=0,jy=0,run=false,drag=false,lastX=0,lastY=0;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');function joystick(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.min(44,Math.hypot(x,y)),a=Math.atan2(y,x);jx=Math.cos(a)*m/44;jy=Math.sin(a)*m/44;knob.style.transform='translate('+jx*44+'px,'+jy*44+'px)'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);joystick(e)};stick.onpointermove=e=>{if(e.buttons)joystick(e)};function reset(){jx=jy=0;knob.style.transform=''}stick.onpointerup=reset;stick.onpointercancel=reset;
document.querySelector('#run').onpointerdown=()=>run=true;document.querySelector('#run').onpointerup=()=>run=false;document.querySelector('#run').onpointercancel=()=>run=false;
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.005;pitch=Math.max(-.25,Math.min(.65,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointercancel=()=>drag=false;
const look=new THREE.Vector3();let prev=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min(.04,(t-prev)/1000);prev=t;const speed=run?7:3.6;let f=-jy,r=jx;player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed*dt;player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*r)*speed*dt;if(Math.abs(jx)+Math.abs(jy)>.1)player.rotation.y=Math.atan2(Math.sin(yaw)*f+Math.cos(yaw)*r,Math.cos(yaw)*f-Math.sin(yaw)*r);camera.position.set(player.position.x+Math.sin(yaw)*6,player.position.y+2.7+pitch*4,player.position.z+Math.cos(yaw)*6);look.set(player.position.x,player.position.y+1.2,player.position.z);camera.lookAt(look);renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
