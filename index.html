<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gaming HUD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;color:#f7f8fa}
body{background:#000}
button{font:inherit;color:#f7f8fa;cursor:pointer;touch-action:manipulation}
.hud{position:absolute;inset:0}
.top-left{position:absolute;top:12px;left:12px;display:flex;align-items:flex-start;gap:20px}
.minimap{width:clamp(95px,14vw,150px);aspect-ratio:1;border-radius:50%;border:5px solid #dfe3e8;background:linear-gradient(145deg,#e8ebef,#aab1ba);box-shadow:0 3px 7px #626a754d,inset 0 0 0 2px #727a84;position:relative;overflow:hidden}
.map-inner{position:absolute;inset:9%;border-radius:50%;background:#d4d9df;border:1px solid #929aa4;overflow:hidden}
.road{position:absolute;background:#edf0f3;border:1px solid #9ba3ad;transform:rotate(-35deg)}.r1{width:150%;height:20%;left:-20%;top:25%}.r2{width:20%;height:150%;left:40%;top:-20%}.r3{width:130%;height:12%;left:-10%;top:68%;transform:rotate(35deg)}
.map-square{position:absolute;width:14%;aspect-ratio:1;background:#b9c0c8;border:1px solid #89919b}.s1{left:15%;top:25%}.s2{left:60%;top:65%}.map-dot{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;background:#d84c4c;border:2px solid white;left:57%;top:34%;box-shadow:0 1px 3px #333}.player-dot{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;background:#2c5948;border:2px solid #e9fff4;left:38%;top:55%}
.map-label{position:absolute;right:4%;top:14%;font-weight:700;font-size:clamp(11px,2vw,18px);text-shadow:0 1px 2px #555;background:#59616b;padding:3px 7px;border-radius:5px}
.money{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:40px;background:linear-gradient(#737a84,#515862);border:2px solid #9da4ad;box-shadow:inset 0 2px 4px #ffffff55,0 3px 5px #5555;min-width:clamp(150px,24vw,260px);height:clamp(52px,9vw,78px)}
.coin{width:clamp(40px,7vw,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f7df8a 0 35%,#c69a3c 53%,#805b1d 70%,#e9c765 76%);border:3px solid #e4d2a0;color:#70521b;font-size:clamp(20px,4vw,36px);text-shadow:0 1px #fff8;box-shadow:0 2px 4px #2228}
.amount{font-size:clamp(18px,3vw,29px);font-weight:600;flex:1}.plus{width:clamp(42px,7vw,62px);aspect-ratio:1;border-radius:50%;border:2px solid #aab1ba;background:linear-gradient(#7c838d,#555c66);font-size:clamp(30px,5vw,45px);line-height:1;box-shadow:inset 0 2px 3px #ffffff55}
.top-actions{position:absolute;right:12px;top:12px;display:flex;gap:clamp(5px,1.2vw,14px)}
.action{width:clamp(58px,9vw,96px);height:clamp(64px,12vw,100px);border-radius:25px;border:2px solid #9aa1ab;background:linear-gradient(145deg,#737a84,#4c535d);box-shadow:inset 0 2px 4px #ffffff55,0 3px 6px #5555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-shadow:0 1px 2px #333;font-size:clamp(12px,2vw,20px)}
.action .ico{font-size:clamp(24px,4vw,42px);line-height:1.1;filter:drop-shadow(0 1px 1px #222)}
.action:active,.round-btn:active,.plus:active{transform:translateY(2px);filter:brightness(1.15)}
.fullscreen{position:absolute;right:12px;top:clamp(90px,15vw,120px);width:clamp(62px,9vw,100px);height:clamp(62px,9vw,100px);border-radius:28px;border:2px solid #9aa1ab;background:linear-gradient(145deg,#737a84,#4c535d);box-shadow:inset 0 2px 4px #ffffff55,0 3px 6px #5555;font-size:clamp(28px,5vw,48px)}
.right-controls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:14px}
.round-btn{width:clamp(82px,13vw,118px);height:clamp(82px,13vw,118px);border-radius:50%;border:3px solid #9aa1ab;background:radial-gradient(circle at 35% 25%,#8b929c,#59616b 70%);box-shadow:inset 0 3px 5px #ffffff55,0 4px 7px #5555;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(16px,2.4vw,23px);text-shadow:0 2px 2px #333}
.round-btn .ico{font-size:clamp(34px,5vw,54px);line-height:1}
.joy-base{position:absolute;left:clamp(20px,4vw,48px);bottom:clamp(16px,3vw,30px);width:clamp(92px,15vh,125px);height:clamp(92px,15vh,125px);border-radius:50%;background:radial-gradient(circle,#737b85 0 45%,#535b65 48%,#a1a8b1 62%,#626a74 70%,#858d97 76%);border:4px solid #929aa4;box-shadow:inset 0 3px 8px #3338,0 3px 7px #5555;display:grid;place-items:center}
.joy-thumb{width:58%;height:58%;border-radius:50%;border:3px solid #8f969f;background:radial-gradient(circle at 35% 25%,#b8bec6,#747c86 55%,#4b535d 75%);box-shadow:inset 0 3px 7px #ffffff55,0 3px 5px #3338;display:grid;place-items:center;touch-action:none;cursor:grab}
.joy-thumb:active{cursor:grabbing}.joy-center{width:42%;height:42%;border-radius:50%;background:conic-gradient(from 20deg,#9ea5ad,#5c646e,#aab1b9,#626a74,#9ea5ad);box-shadow:inset 0 2px 4px #3338;border:1px solid #747c86}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#3f4650dd;padding:14px 22px;border-radius:12px;border:1px solid #ffffff55;display:none;font-size:18px;box-shadow:0 8px 25px #2225}
@media(max-width:600px){.top-left{gap:8px;top:8px;left:8px}.top-actions{top:8px;right:8px;gap:5px}.action{border-radius:10px}.fullscreen{right:8px}.right-controls{right:8px;bottom:10px;gap:10px}.joy-base{left:18px;bottom:20px}.money{min-width:90px}.top-actions .action{width:clamp(38px,6.5vh,54px);height:clamp(42px,7.5vh,58px)}.top-actions .ico{font-size:19px}.top-actions .action{font-size:10px}}
/* Landscape-only gameplay + scalable HUD */
#world{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;background:linear-gradient(#79b8ee 0%,#c9e7ff 62%,#78ad54 62%,#477b3d 100%);overflow:hidden}#sceneFallback{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#79b8ee 0%,#c9e7ff 62%,#78ad54 62%,#477b3d 100%)}.fallback-sun{position:absolute;right:18%;top:12%;width:9vh;height:9vh;border-radius:50%;background:#ffeaa0;box-shadow:0 0 50px #fff4a8}.city-building{position:absolute;bottom:42%;width:18%;height:36%;background:linear-gradient(90deg,#9b9da2,#d1d1d0 50%,#898d93);border:3px solid #686d75;box-shadow:8px 8px 0 #4d555c66}.building-one{left:13%;height:30%}.building-two{right:13%;height:42%;width:20%;background:linear-gradient(90deg,#a9a49a,#e0d8c9 50%,#8b857b)}.windows{position:absolute;inset:12% 10%;background:repeating-linear-gradient(90deg,#33485b 0 12%,transparent 12% 25%),repeating-linear-gradient(0deg,#3a5269 0 13%,transparent 13% 25%);border:5px solid #8a8d91}.fallback-ground{position:absolute;inset:58% 0 0;background-color:#777b80;background-image:linear-gradient(45deg,#8c9095 25%,transparent 25%,transparent 75%,#8c9095 75%),linear-gradient(45deg,#8c9095 25%,#666b71 25%,#666b71 75%,#8c9095 75%);background-size:42px 42px;background-position:0 0,21px 21px;border-top:5px solid #555b62}.fallback-person{position:absolute;left:50%;top:52%;width:70px;height:150px;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 4px #24432666)}.fallback-person i{position:absolute;display:block}.fallback-person .head{width:34px;height:36px;left:18px;top:0;border-radius:50%;background:#d9a77f;border:3px solid #65452d}.fallback-person .body{width:42px;height:57px;left:14px;top:37px;border-radius:14px 14px 8px 8px;background:#2878b8}.fallback-person .arm{width:13px;height:50px;top:43px;background:#d9a77f;border-radius:9px}.fallback-person .a{left:4px;transform:rotate(12deg)}.fallback-person .b{right:4px;transform:rotate(-12deg)}.fallback-person .leg{width:17px;height:54px;top:88px;background:#26384e;border-radius:8px}.fallback-person .l{left:17px;transform:rotate(5deg)}.fallback-person .r{right:17px;transform:rotate(-5deg)}#world canvas{position:absolute!important;left:0!important;top:0!important;display:block;width:100vw!important;height:100vh!important}.hud{z-index:1}
@media (orientation:portrait){body{background:#171b22!important}#world,.hud{display:none!important}body:after{content:"↻  Rotate your device to landscape to play";position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#f5f7fb;font-size:clamp(20px,5vw,32px);font-weight:700;background:radial-gradient(circle,#343b46,#171b22)}}
@media (orientation:landscape){
.minimap{width:clamp(58px,10vh,105px)}.top-left{top:clamp(7px,1.5vh,18px);left:clamp(7px,1.5vw,18px);gap:clamp(8px,2vw,22px)}
.money{height:clamp(32px,6.5vh,48px);min-width:clamp(88px,13vw,135px);padding:3px 5px;gap:5px;border-width:1px}.money .amount{font-size:clamp(15px,3vh,23px)}.coin{width:clamp(25px,5vh,40px)}.plus{width:clamp(27px,5vh,38px);font-size:clamp(20px,4vh,30px)}.coin{width:clamp(35px,7vh,60px)}.plus{width:clamp(38px,7vh,58px)}
.top-actions{top:clamp(7px,1.5vh,18px);right:clamp(7px,1.5vw,18px);gap:clamp(4px,.8vw,12px)}.action{width:clamp(38px,6.5vh,54px);height:clamp(42px,7.5vh,58px);min-width:0;padding:3px;border-radius:10px;border-width:1px;box-shadow:inset 0 1px 2px #ffffff44,0 2px 3px #5554;font-size:clamp(8px,1.25vh,11px)}.action .ico{font-size:clamp(16px,2.8vh,22px);line-height:1}
.fullscreen{top:clamp(72px,15vh,112px);right:clamp(7px,1.5vw,18px);width:clamp(52px,10vh,88px);height:clamp(42px,8vh,70px);border-radius:clamp(15px,3vh,25px)}
.joy-base{left:clamp(18px,5vw,70px);bottom:clamp(14px,3vh,32px);width:clamp(75px,15vh,115px);height:clamp(75px,15vh,115px)}
.right-controls{right:clamp(8px,1.5vw,18px);bottom:clamp(8px,1.5vh,18px);gap:clamp(8px,2vh,15px)}.round-btn{width:clamp(58px,12vh,88px);height:clamp(58px,12vh,88px);font-size:clamp(13px,2.5vh,21px)}.round-btn .ico{font-size:clamp(28px,6vh,48px)}
}</style>
</head>
<body>
<div id="world"><div id="sceneFallback"><div class="fallback-sun"></div><div class="city-building building-one"><div class="windows"></div></div><div class="city-building building-two"><div class="windows"></div></div><div class="fallback-ground"></div><div class="fallback-person"><i class="head"></i><i class="body"></i><i class="arm a"></i><i class="arm b"></i><i class="leg l"></i><i class="leg r"></i></div></div></div>

<div class="hud">
 <div class="top-left">
  <div class="minimap"><div class="map-inner"><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><i class="map-square s1"></i><i class="map-square s2"></i><i class="map-dot"></i><i class="player-dot"></i></div><span class="map-label">MAP</span></div>
  <div class="money"><div class="coin">♛</div><span class="amount" id="coins">500</span><button class="plus" id="addCoins" aria-label="Add coins">+</button></div>
 </div>
 <div class="top-actions">
  <button class="action" data-panel="Shop"><span class="ico">🛒</span>Shop</button>
  <button class="action" data-panel="Inventory"><span class="ico">▦</span>Inventory</button>
  <button class="action" data-panel="Settings"><span class="ico">⚙</span>Settings</button>
  <button class="action" data-panel="Phone"><span class="ico">📱</span>Phone</button>
  <button class="action" data-panel="Pause"><span class="ico">Ⅱ</span>Pause</button>
 </div>
 <button class="fullscreen" id="fullscreen" aria-label="Fullscreen">⛶</button>
 <div class="joy-base" id="joyBase"><div class="joy-thumb" id="joyThumb"><div class="joy-center"></div></div></div>
 <div class="right-controls"><button class="round-btn" id="run"><span class="ico">🏃</span>Run</button><button class="round-btn" id="jump"><span class="ico">🦘</span>Jump</button></div>
 <div class="toast" id="toast"></div>
</div>
<script>
let coins=500;document.getElementById('addCoins').onclick=()=>{coins+=100;document.getElementById('coins').textContent=coins;show(' +100 coins')};
function show(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',1300)}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>show(b.dataset.panel));
document.getElementById('run').onclick=()=>show('Run');document.getElementById('jump').onclick=()=>show('Jump');
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=> {
const world=document.getElementById('world'),base=document.getElementById('joyBase'),thumb=document.getElementById('joyThumb');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9acbf4);scene.fog=new THREE.Fog(0x9acbf4,55,180);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;world.appendChild(renderer.domElement);renderer.domElement.style.zIndex='0';
scene.add(new THREE.HemisphereLight(0xffffff,0x59616b,2));const sun=new THREE.DirectionalLight(0xfff3dc,2.2);sun.position.set(-30,60,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),mat(0x45494d));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// City grid streets and sidewalks
const roadMat=mat(0x292e34),walkMat=mat(0x8b8b87),lineMat=mat(0xe8d7a0);
function slab(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
for(let k=-4;k<=4;k++){let p=k*24;slab(10,.12,260,roadMat,p,.06,0);slab(260,.12,10,roadMat,0,.06,p);slab(2,.025,260,lineMat,p,.13,0);for(let side of [-1,1]){slab(3,.22,260,walkMat,p+side*6.5,.16,0);slab(260,.22,3,walkMat,0,.16,p+side*6.5)}}
// building blocks, all 3D with windows, doors, roofs
const buildingMats=[0xb9b8b2,0xc7b9a7,0x9ca9b3,0xd1c9bd,0x92999e].map(x=>mat(x));
const glass=mat(0x263f56,.22),door=mat(0x49382c),roof=mat(0x56585b);
function building(x,z,w,d,h,mi){let m=buildingMats[mi%buildingMats.length];slab(w,h,d,m,x,h/2,z);slab(w+.15,.25,d+.15,roof,x,h+.12,z);
for(let yy=1;yy<h-.5;yy+=1.35){for(let xx=-w/2+.55;xx<w/2-.35;xx+=1.05){slab(.48,.62,.07,glass,x+xx,yy,z-d/2-.04);slab(.48,.62,.07,glass,x+xx,yy,z+d/2+.04)}for(let zz=-d/2+.55;zz<d/2-.35;zz+=1.05){slab(.07,.62,.48,glass,x-w/2-.04,yy,z+zz);slab(.07,.62,.48,glass,x+w/2+.04,yy,z+zz)}}
slab(.8,1.8,.1,door,x, .9,z-d/2-.09);
}
// Blocks fill city with gaps and varied heights
for(let bx=-4;bx<=4;bx++)for(let bz=-4;bz<=4;bz++){if(Math.abs(bx)<1&&Math.abs(bz)<1)continue;let x=bx*24,z=bz*24;building(x-5,z-5,7,8,5+((bx*bz+8)%4+4)%4*2,(bx+bz+20)%5);building(x+5,z+5,8,7,7+((bx+2*bz+12)%5+5)%5*2,(bx*bz+30)%5)}
// street cobbles with modeled relief on playable block
const stones=[0x85898d,0x73787d,0x92969a,0x686e73].map(mat);for(let z=-22;z<22;z+=.7)for(let x=-22;x<22;x+=.72){let s=new THREE.Mesh(new THREE.BoxGeometry(.65,.07,.54),stones[(Math.floor(x*3+z*7)%4+4)%4]);s.position.set(x,.05,z);s.rotation.y=(Math.random()-.5)*.06;s.receiveShadow=true;scene.add(s)}
// third-person character
const player=new THREE.Group();scene.add(player);const skin=mat(0xc9956e),shirt=mat(0x226bb1),pants=mat(0x26364a),black=mat(0x25282c);
function piece(parent,g,m,x,y,z){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
piece(player,new THREE.SphereGeometry(.24,16,16),skin,0,1.85,0);piece(player,new THREE.SphereGeometry(.245,16,12),mat(0x302019),0,1.98,-.04).scale.set(1,.5,1);piece(player,new THREE.CylinderGeometry(.3,.38,.72,12),shirt,0,1.22,0);
const arms=[],legs=[];for(let side of [-1,1]){let a=new THREE.Group();a.position.set(side*.38,1.5,0);player.add(a);piece(a,new THREE.CylinderGeometry(.09,.11,.5,10),shirt,0,-.25,0);piece(a,new THREE.SphereGeometry(.1,10,10),skin,0,-.53,0);arms.push(a);let l=new THREE.Group();l.position.set(side*.16,.83,0);player.add(l);piece(l,new THREE.CylinderGeometry(.12,.14,.5,10),pants,0,-.25,0);piece(l,new THREE.BoxGeometry(.2,.12,.32),black,0,-.53,.07);legs.push(l)}
let joyX=0,joyY=0,isRun=false,jumping=0,walkT=0,camYaw=0,camPitch=.22,camDist=7;
let joyPointer=null,camPointer=null,lastX=0,lastY=0;
function joystick(e){let r=base.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.32,d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}thumb.style.transform='translate('+dx+'px,'+dy+'px)';joyX=dx/max;joyY=dy/max}
function stopJoy(){joyPointer=null;joyX=joyY=0;thumb.style.transform='translate(0,0)'}
base.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;base.setPointerCapture(e.pointerId);joystick(e)});base.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joystick(e)});base.addEventListener('pointerup',e=>{if(e.pointerId===joyPointer)stopJoy()});base.addEventListener('pointercancel',stopJoy);
world.addEventListener('pointerdown',e=>{camPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;world.setPointerCapture(e.pointerId)});world.addEventListener('pointermove',e=>{if(e.pointerId===camPointer){camYaw-=(e.clientX-lastX)*.008;camPitch=Math.max(-.05,Math.min(.65,camPitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}});function stopCam(e){if(e.pointerId===camPointer)camPointer=null}world.addEventListener('pointerup',stopCam);world.addEventListener('pointercancel',stopCam);
const runBtn=document.getElementById('run');runBtn.addEventListener('pointerdown',e=>{e.preventDefault();isRun=true;runBtn.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>runBtn.addEventListener(ev,()=>isRun=false));
document.getElementById('jump').onclick=()=>{if(player.position.y<=.01)jumping=5.5};
let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;let mag=Math.hypot(joyX,joyY);
if(mag>.1){let forward=-joyY/mag,right=joyX/mag,speed=(isRun?8:4.2)*Math.min(mag,1);let angle=camYaw;let vx=(right*Math.cos(angle)+forward*Math.sin(angle)),vz=(-right*Math.sin(angle)+forward*Math.cos(angle));player.position.x+=vx*speed*dt;player.position.z+=vz*speed*dt;player.rotation.y=Math.atan2(vx,vz);walkT+=dt*(isRun?14:9);legs[0].rotation.x=Math.sin(walkT)*.65;legs[1].rotation.x=-Math.sin(walkT)*.65;arms[0].rotation.x=-Math.sin(walkT)*.4;arms[1].rotation.x=Math.sin(walkT)*.4}else{legs.forEach(l=>l.rotation.x*=.8);arms.forEach(a=>a.rotation.x*=.8)}
jumping-=12*dt;player.position.y=Math.max(0,player.position.y+jumping*dt);if(player.position.y===0)jumping=0;
let tx=player.position.x+Math.sin(camYaw)*camDist, tz=player.position.z+Math.cos(camYaw)*camDist;camera.position.x+=(tx-camera.position.x)*.14;camera.position.z+=(tz-camera.position.z)*.14;camera.position.y+=(2.8+camPitch*8-camera.position.y)*.12;camera.lookAt(player.position.x,1.1+player.position.y,player.position.z);renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
<script>
(()=> {
 const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87b9e8); scene.fog=new THREE.Fog(0x87b9e8,35,110);
 const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,120);camera.position.set(0,2.5,6.5);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(document.getElementById('world').clientWidth,document.getElementById('world').clientHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.domElement.style.zIndex='1';renderer.domElement.style.opacity='0';renderer.domElement.style.background='transparent';document.getElementById('world').appendChild(renderer.domElement);
