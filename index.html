<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>Nairobi Life 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}
#rotate{display:none;position:fixed;inset:0;background:#101820;z-index:20;align-items:center;justify-content:center;text-align:center;padding:24px}
#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101820cc;border:1px solid #ffffff30;border-radius:12px;padding:10px 12px}

#stick{pointer-events:auto;position:absolute;left:5.2%;bottom:5%;width:116px;height:116px;border-radius:50%;background:radial-gradient(circle,#9ba2a9 0%,#59616a 48%,#242a31 70%,#aeb5bb 74%,#4a515a 100%);border:3px solid #c4cbd1;box-shadow:0 4px 10px #0007;touch-action:none}
#knob{position:absolute;width:62px;height:62px;left:25px;top:25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d5d9dd,#747b83 55%,#30363d 75%);border:3px solid #aeb5bc;box-shadow:inset 0 2px 5px #fff6}
#actions{pointer-events:auto;position:absolute;right:3%;bottom:5%;display:flex;flex-direction:column;gap:12px;align-items:center}
button{border:2px solid #aeb6bf;background:linear-gradient(145deg,#89919a,#343b44);color:white;border-radius:50%;width:78px;height:78px;font-weight:bold;touch-action:none;box-shadow:0 4px 8px #0005,inset 0 1px 2px #fff8;font-size:16px}
button:active{background:#c4a34b;color:#111}

@media(orientation:portrait){#rotate{display:flex}#hud{display:none}}

#money{position:absolute;top:3%;left:13%;height:58px;min-width:190px;border-radius:32px;background:linear-gradient(145deg,#aab1b9,#515963);border:2px solid #c4cbd2;display:flex;align-items:center;gap:12px;font-size:22px;box-shadow:0 3px 8px #0005}
#money button{width:44px;height:44px;font-size:28px;padding:0}
#menu{position:absolute;top:3%;right:2%;display:flex;gap:7px;pointer-events:auto}
#menu button{width:68px;height:68px;border-radius:18px;font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
small{font-size:13px;font-weight:500}
#fullscreen{pointer-events:auto;position:absolute;right:2%;top:18%;width:68px;height:68px;border-radius:18px;font-size:32px}
#actions button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#popup{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:220px;text-align:center;font-size:18px}
@media(max-height:430px){#menu button{width:60px;height:60px}#fullscreen{top:20%;width:58px;height:58px}#actions button{width:68px;height:68px}}
</style></head><body>
<div id="rotate">📱<br><br>Please rotate your phone to landscape to play.</div>
<div id="hud">
<div id="money" class="panel">🪙 <span id="cash">500</span> <button id="addcash">＋</button></div>
<div id="menu"><button data-menu="Shop">🛒<small>Shop</small></button><button data-menu="Inventory">▦<small>Inventory</small></button><button data-menu="Settings">⚙<small>Settings</small></button><button data-menu="Phone">▯<small>Phone</small></button><button data-menu="Pause">Ⅱ<small>Pause</small></button></div>
<button id="fullscreen" aria-label="Fullscreen">⛶</button>
<div id="stick"><div id="knob"></div></div><div id="actions"><button id="run">🏃<small>Run</small></button><button id="jump">🐇<small>Jump</small></button></div>
<div id="popup" class="panel" hidden></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7df);scene.fog=new THREE.Fog(0x9bc7df,90,260);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=false;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53634b,2));const sun=new THREE.DirectionalLight(0xfff2d5,2);sun.position.set(40,80,30);scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.9});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x777b76));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
// Road grid and Nairobi-style city blocks
const roadMat=mat(0x30383b),pave=mat(0xb6b3a7),stone=mat(0x888982);
for(let i=-180;i<=180;i+=36){let r=new THREE.Mesh(new THREE.BoxGeometry(12,.08,360),roadMat);r.position.set(i,.01,0);scene.add(r);let q=new THREE.Mesh(new THREE.BoxGeometry(360,.08,12),roadMat);q.position.set(0,.01,i);scene.add(q)}
// Cobblestone side streets and sidewalks as textured-looking paving tiles
const tileGeo=new THREE.BoxGeometry(1.8,.12,1.8);
for(let x=-170;x<170;x+=2)for(let z=-170;z<170;z+=2){if(Math.abs((x+180)%36-18)<7||Math.abs((z+180)%36-18)<7)continue;let t=new THREE.Mesh(tileGeo,stone);t.position.set(x,.03,z);scene.add(t)}
// District blocks: varied apartment/office forms, courtyards and trees
const colors=[0xc5b7a2,0x9da9ad,0xd4c9b5,0x777f85,0xb3a18d,0xe0d8c8];
for(let bx=-5;bx<=5;bx++)for(let bz=-5;bz<=5;bz++){if(Math.abs(bx)<1&&Math.abs(bz)<1)continue;const centerX=bx*36+18,centerZ=bz*36+18;for(let k=0;k<3;k++){let x=centerX+(k-1)*9,z=centerZ+(Math.random()-.5)*16,w=7+Math.random()*4,d=8+Math.random()*6,h=8+Math.random()*35;if(Math.random()<.2)h=45+Math.random()*45;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(colors[Math.floor(Math.random()*colors.length)]));b.position.set(x,h/2,z);scene.add(b);let roof=new THREE.Mesh(new THREE.BoxGeometry(w+.2,.3,d+.2),mat(0x555b60));roof.position.set(x,h+.15,z);scene.add(roof);
for(let yy=3;yy<h-2;yy+=3.5)for(let xx=-w/2+1;xx<w/2-0.5;xx+=2){let win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.2,.08),mat(0x426779));win.position.set(x+xx,yy,z+d/2+.05);scene.add(win)}
}}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.15,4,8),mat(0x263b58));body.position.y=1.25;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),mat(0x8a573c));head.position.y=2.15;player.add(head);scene.add(player);player.position.set(0,0,0);
let yaw=0,pitch=-.18,joyX=0,joyY=0,running=false,velY=0;const target=new THREE.Vector3();
function cam(){let distance=7.5;camera.position.set(player.position.x+Math.sin(yaw)*distance,player.position.y+3.2+pitch*5,player.position.z+Math.cos(yaw)*distance);target.set(player.position.x,player.position.y+1.5,player.position.z);camera.lookAt(target)}
cam();
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let stickId=null;function joy(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(48,Math.hypot(dx,dy));let a=Math.atan2(dy,dx);joyX=Math.cos(a)*m/48;joyY=Math.sin(a)*m/48;knob.style.transform='translate('+joyX*48+'px,'+joyY*48+'px)'}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);joy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)joy(e)});function reset(){stickId=null;joyX=joyY=0;knob.style.transform=''}stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
document.querySelector('#run').onpointerdown=()=>running=true;document.querySelector('#run').onpointerup=()=>running=false;document.querySelector('#run').onpointercancel=()=>running=false;document.querySelector('#jump').onclick=()=>{if(player.position.y<.05)velY=8};
let drag=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.006;pitch=Math.max(-.65,Math.min(.5,pitch+(e.clientY-py)*.004));px=e.clientX;py=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
function drawMap(){}
let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min(.04,(now-last)/1000);last=now;let speed=running?9:4.5;let forward=-joyY,right=joyX;let dx=(Math.sin(yaw)*forward+Math.cos(yaw)*right)*speed*dt,dz=(Math.cos(yaw)*forward-Math.sin(yaw)*right)*speed*dt;player.position.x+=dx;player.position.z+=dz;if(Math.hypot(joyX,joyY)>.08)player.rotation.y=Math.atan2(dx,dz);velY-=20*dt;player.position.y=Math.max(0,player.position.y+velY*dt);if(player.position.y===0)velY=0;cam();renderer.render(scene,camera)}requestAnimationFrame(animate);
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{let p=document.querySelector('#popup');p.hidden=false;p.textContent=b.dataset.menu+' • Coming soon';setTimeout(()=>p.hidden=true,1800)});
document.querySelector('#addcash').onclick=()=>{document.querySelector('#cash').textContent='500'};
document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
