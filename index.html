<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Nairobi Life 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b7d4;touch-action:none}canvas{display:block}#stick{position:fixed;left:5%;bottom:6%;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff70;background:#ffffff20;touch-action:none}#knob{position:absolute;left:33px;top:33px;width:52px;height:52px;border-radius:50%;background:#ffffff80;border:2px solid #fff}#load{position:fixed;top:12px;left:12px;color:white;background:#0009;padding:8px;border-radius:8px;font:12px Arial;z-index:5;max-width:75vw}#fullscreen{position:fixed;right:5%;top:12px;z-index:10;background:#172532dd;color:white;border:1px solid #ffffff70;border-radius:10px;padding:11px 14px;font:14px Arial}@media(orientation:portrait){body:after{content:"Rotate phone to landscape";position:fixed;inset:0;background:#111;color:white;display:grid;place-items:center;font:20px Arial}}</style></head><body><div id="load">Loading Uhuru Park…</div><div id="stick"><div id="knob"></div></div><button id="fullscreen">⛶ FULL SCREEN</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9e8);scene.fog=new THREE.Fog(0x9bc9e8,180,700);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x59634b,2));const sun=new THREE.DirectionalLight(0xfff1d6,1.2);sun.position.set(100,150,80);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshLambertMaterial({color:0x5b9851}));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);
// Nairobi-style city blocks: roads, sidewalks, and procedural buildings
const roadMat=new THREE.MeshLambertMaterial({color:0x33383d}),lineMat=new THREE.MeshLambertMaterial({color:0xe7dca8}),sideMat=new THREE.MeshLambertMaterial({color:0xaaa9a0});
function road(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.06,d),roadMat);m.position.set(x,.01,z);scene.add(m);let stripe=new THREE.Mesh(new THREE.BoxGeometry(w*.65,.025,.22),lineMat);stripe.position.set(x,.05,z);scene.add(stripe)}
for(let i=-5;i<=5;i++){road(i*90,0,18,1000);road(0,i*90,1000,18)}
for(let x=-450;x<=450;x+=90)for(let z=-450;z<=450;z+=90){for(let k=0;k<5;k++){let bx=x+(Math.random()-.5)*55,bz=z+(Math.random()-.5)*55,w=12+Math.random()*25,d=12+Math.random()*25,h=12+Math.random()*75;const mat=new THREE.MeshLambertMaterial({color:[0xb9b2a5,0xaaaeb4,0xc6b79e,0x8d9b9b,0xd0c9bd][Math.floor(Math.random()*5)]});let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);b.position.set(bx,h/2,bz);scene.add(b);let roof=new THREE.Mesh(new THREE.BoxGeometry(w+1,.5,d+1),sideMat);roof.position.set(bx,h+.25,bz);scene.add(roof);for(let y=3;y<h-2;y+=4){let winmat=new THREE.MeshLambertMaterial({color:0x5c91a8});for(let xx=-w/2+2;xx<w/2-1;xx+=4){let win=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,.12),winmat);win.position.set(bx+xx,y,bz+d/2+.08);scene.add(win)}}}}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.9,3,6),new THREE.MeshLambertMaterial({color:0x253b58}));body.position.y=1;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,8,6),new THREE.MeshLambertMaterial({color:0x8a573c}));head.position.y=1.72;player.add(head);scene.add(player);
document.querySelector('#load').textContent='Nairobi City generated ✓';
let yaw=0,pitch=.12,jx=0,jy=0,drag=false,lastX=0,lastY=0;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');function joystick(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.min(44,Math.hypot(x,y)),a=Math.atan2(y,x);jx=Math.cos(a)*m/44;jy=Math.sin(a)*m/44;knob.style.transform='translate('+jx*44+'px,'+jy*44+'px)'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);joystick(e)};stick.onpointermove=e=>{if(e.buttons)joystick(e)};function reset(){jx=jy=0;knob.style.transform=''}stick.onpointerup=reset;stick.onpointercancel=reset;
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.005;pitch=Math.max(-.25,Math.min(.65,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointercancel=()=>drag=false;
const look=new THREE.Vector3();let prev=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min(.04,(t-prev)/1000);prev=t;const speed=5,f=-jy,r=jx;player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed*dt;player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*r)*speed*dt;if(Math.abs(jx)+Math.abs(jy)>.1)player.rotation.y=Math.atan2(Math.sin(yaw)*f+Math.cos(yaw)*r,Math.cos(yaw)*f-Math.sin(yaw)*r);camera.position.set(player.position.x+Math.sin(yaw)*7,player.position.y+3+pitch*4,player.position.z+Math.cos(yaw)*7);look.set(player.position.x,player.position.y+1.2,player.position.z);camera.lookAt(look);renderer.render(scene,camera)}requestAnimationFrame(frame);
const fsBtn=document.querySelector('#fullscreen');fsBtn.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){document.querySelector('#load').textContent='Fullscreen unavailable: '+e.message}};document.addEventListener('fullscreenchange',()=>{fsBtn.textContent=document.fullscreenElement?'✕ EXIT FULL SCREEN':'⛶ FULL SCREEN'});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
